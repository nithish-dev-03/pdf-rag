[project]
name = "pdf-rag-gemini"
version = "0.1.0"
description = "RAG pipeline over a PDF using the Google Gen AI SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.3.0",
    "pgvector>=0.5.1",
    "psycopg>=3.3.9",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
pdf-rag = "app.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
